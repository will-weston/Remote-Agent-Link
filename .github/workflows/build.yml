name: Build and package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: .\scripts\build.ps1
      - name: Deterministic checks
        run: .\scripts\test.ps1 -SkipBuild
      - name: Create unsigned package
        run: .\scripts\package.ps1 -SkipBuild
      - name: Upload unsigned validation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RemoteAgentLink-x64-unsigned
          path: |
            artifacts\packages\*.msix
            artifacts\packages\*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
