name: Bug report
description: Report a reproducible problem with the plugin, broker, or MCP host.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        For a suspected vulnerability, follow SECURITY.md instead of posting exploit details here.
        Remove credentials, user/device identifiers, endpoint fingerprints, private paths,
        prompts and sensitive screen contents from anything you share.
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: Include whether this is an installed MSIX or a source build.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or packaged COM
        - RDP channel or device verification
        - MCP discovery or binding
        - Desktop access or approvals
        - WinUI or accessibility
        - Copilot tasks or reconnect
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows builds, public RDP client version, local/remote role, architecture, and relevant scaling or display layout. Do not include account or machine names.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a benign example. Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant error codes and minimal redacted logs or screenshots, not complete profiles or data directories.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets and personal or confidential information from this report.
          required: true
