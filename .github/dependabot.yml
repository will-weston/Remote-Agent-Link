version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
    groups:
      windows-ui:
        patterns:
          - Microsoft.WindowsAppSDK*
          - Microsoft.Windows.SDK.BuildTools
          - Microsoft.Windows.CsWinRT
      dotnet-libraries:
        patterns:
          - Microsoft.Data.Sqlite
          - System.*
